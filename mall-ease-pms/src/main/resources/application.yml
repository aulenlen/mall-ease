server:
  port: 9055

spring:
  datasource:
    url: jdbc:mysql://192.168.50.148:13306/mall-ease?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: 123456

  # Redis 配置（与 auth 服务保持一致）
  data:
    redis:
      host: 192.168.50.148
      database: 0
      port: 16379
      password:
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms
  elasticsearch:
    rest:
      uris: http://192.168.50.148:9200
      connection-timeout: 5s
      read-timeout: 60s

mybatis:
  mapper-locations: classpath:mybatis/mapper/*.xml

minio:
  endpoint: http://192.168.50.148:19000  # 修改为新的端口
  bucketName: mall-ease
  accessKey: minioadmin
  secretKey: minioadmin

# Sa-Token 配置（与 auth 服务保持一致）
sa-token:
  token-name: Authorization
  timeout: 604800
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false
  is-read-cookie: false
  is-read-header: true
  token-prefix: Bearer
  jwt-secret-key: sa-secret-key123
  is-print: false

# PageHelper 分页插件配置
pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true
  params: count=countSql

# Knife4j API文档配置
knife4j:
  enable: true
  setting:
    language: zh_cn

# 线程池配置
thread-pool:
  # 通用业务线程池
  task-executor:
    core-pool-size: 10
    max-pool-size: 20
    queue-capacity: 200
    keep-alive-seconds: 60
    thread-name-prefix: "mall-task-"

# SpringDoc OpenAPI配置
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
  group-configs:
    - group: 'PMS商品管理'
      paths-to-match: '/pms/**'