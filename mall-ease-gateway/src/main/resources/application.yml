server:
  port: 9051

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  cloud:
    gateway:
      routes:
        - id: api-v1-product
          uri: lb://mall-ease-product
          predicates:
            - Path=/api/v1/admin/categories/**,/api/v1/admin/brands/**,/api/v1/admin/attributes/**,/api/v1/admin/products/**,/api/v1/admin/skus/**,/api/v1/admin/stocks/**,/api/v1/portal/products/**
          filters:
            - StripPrefix=2
        - id: api-v1-content
          uri: lb://mall-ease-content
          predicates:
            - Path=/api/v1/admin/content/**
          filters:
            - StripPrefix=2
        - id: api-v1-user
          uri: lb://mall-ease-user
          predicates:
            - Path=/api/v1/admin/auth/**,/api/v1/admin/users/**,/api/v1/admin/roles/**,/api/v1/admin/menus/**,/api/v1/admin/resources/**,/api/v1/admin/member-levels/**,/api/v1/portal/auth/**,/api/v1/portal/account/**
          filters:
            - StripPrefix=2
        - id: api-v1-marketing
          uri: lb://mall-ease-marketing
          predicates:
            - Path=/api/v1/admin/flash/**,/api/v1/portal/flash/**,/api/v1/admin/sign/**,/api/v1/portal/sign/**
          filters:
            - StripPrefix=2
        - id: api-v1-bff
          uri: lb://mall-ease-bff
          predicates:
            - Path=/api/v1/portal/home,/api/v1/portal/home/**,/api/v1/portal/categories,/api/v1/portal/categories/**,/api/v1/portal/articles,/api/v1/portal/articles/**
          filters:
            - StripPrefix=2
        - id: api-v1-search
          uri: lb://mall-ease-search
          predicates:
            - Path=/api/v1/admin/search/**,/api/v1/portal/search/**
          filters:
            - StripPrefix=2
        - id: api-v1-trade
          uri: lb://mall-ease-trade
          predicates:
            - Path=/api/v1/admin/orders/**,/api/v1/admin/payments/**,/api/v1/portal/cart/**,/api/v1/portal/orders/**,/api/v1/portal/payments/**
          filters:
            - StripPrefix=2
        - id: api-v1-flash-order
          uri: lb://mall-ease-marketing
          predicates:
            - Path=/api/v1/portal/flash/orders
          filters:
            - StripPrefix=2
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userKeyResolver}"
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 15
                redis-rate-limiter.requestedTokens: 1

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

sa-token:
  token-name: Authorization
  timeout: 604800
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false
  is-read-cookie: false
  is-read-header: true
  token-prefix: Bearer
  jwt-secret-key: ${SA_TOKEN_SECRET:sa-secret-key-default}
  is-print: false
