server:
  port: 9051

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  cloud:
    gateway:
      routes:
        - id: mall-ease-product
          uri: lb://mall-ease-product
          predicates:
            - Path=/mall-ease-product/**
          filters:
            - StripPrefix=1
        - id: mall-ease-content
          uri: lb://mall-ease-content
          predicates:
            - Path=/mall-ease-content/**
          filters:
            - StripPrefix=1
        - id: mall-ease-auth
          uri: lb://mall-ease-auth
          predicates:
            - Path=/mall-ease-auth/**
          filters:
            - StripPrefix=1
        - id: mall-ease-user
          uri: lb://mall-ease-user
          predicates:
            - Path=/mall-ease-user/**
          filters:
            - StripPrefix=1

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

sa-token:
  token-name: Authorization
  timeout: 604800
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false
  is-read-cookie: false
  is-read-header: true
  token-prefix: Bearer
  jwt-secret-key: ${SA_TOKEN_SECRET:sa-secret-key-default}
  is-print: false
