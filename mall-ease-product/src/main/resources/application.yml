server:
  port: 9055

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}  # 默认使用 local 配置

  # 文件上传配置
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB        # 单个文件最大 10MB
      max-request-size: 50MB     # 单次请求最大 50MB（多文件上传时）

  # 数据源配置 - 敏感信息由 profile 文件提供
  datasource:
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    # Druid 连接池通用配置
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false

  # Redis 配置
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

  # Elasticsearch 配置（Spring Boot 3.x 路径）
  elasticsearch:
    uris: ${ES_URIS:http://localhost:9200}
    connection-timeout: 5s
    socket-timeout: 60s

mybatis:
  mapper-locations: classpath:mybatis/mapper/*.xml

# 存储配置（支持 MinIO / Cloudflare R2 / 阿里云 OSS 等 S3 兼容存储）
storage:
  # 公开访问的基础 URL（自定义域名，用于生成图片访问链接）
  public-url: ${STORAGE_PUBLIC_URL:}

# S3 兼容存储配置（MinIO / R2 / OSS 等）
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  bucketName: ${MINIO_BUCKET:mall-ease}
  accessKey: ${MINIO_ACCESS_KEY:}
  secretKey: ${MINIO_SECRET_KEY:}

# Sa-Token 配置
sa-token:
  token-name: Authorization
  timeout: 604800
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false
  is-read-cookie: false
  is-read-header: true
  token-prefix: Bearer
  jwt-secret-key: ${SA_TOKEN_SECRET:sa-secret-key-default}
  is-print: false

# PageHelper 分页插件配置
pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true
  params: count=countSql

# Knife4j API文档配置
knife4j:
  enable: true
  setting:
    language: zh_cn

# 线程池配置
thread-pool:
  task-executor:
    core-pool-size: 10
    max-pool-size: 20
    queue-capacity: 200
    keep-alive-seconds: 60
    thread-name-prefix: "mall-task-"

# SpringDoc OpenAPI配置
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
  group-configs:
    - group: '商品管理'
      paths-to-match:
        - /admin/marketing/flash/**
        - /portal/marketing/flash/**
        - /internal/marketing/flash/**
