spring:
  # Redis 配置（生产环境）
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:16379}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DATABASE:0}
      ssl:
        enabled: false
      timeout: 10s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4
          max-wait: 3000ms

# Sa-Token 配置（生产环境使用强密钥）
sa-token:
  jwt-secret-key: ${SA_TOKEN_SECRET}

# 日志配置（生产环境）
logging:
  level:
    com.mallease: INFO