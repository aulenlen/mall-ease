[supervisord]
nodaemon=true
logfile=/var/log/mall-ease/supervisord.log
pidfile=/tmp/supervisord.pid

[program:mysql]
command=/usr/bin/mysqld_safe --datadir=/var/lib/mysql --bind-address=127.0.0.1
autorestart=true
stdout_logfile=/var/log/mall-ease/mysql.log
stderr_logfile=/var/log/mall-ease/mysql.err.log

[program:redis]
command=/usr/bin/redis-server --save "" --appendonly no --protected-mode no --bind 127.0.0.1
autorestart=true
stdout_logfile=/var/log/mall-ease/redis.log
stderr_logfile=/var/log/mall-ease/redis.err.log

[program:nacos]
command=/bin/bash -lc 'cd /opt/nacos-server && bin/startup.sh -m standalone && tail -F logs/start.out'
autorestart=true
stdout_logfile=/var/log/mall-ease/nacos.log
stderr_logfile=/var/log/mall-ease/nacos.err.log

[program:elasticsearch]
command=/opt/elasticsearch/bin/elasticsearch
user=esuser
environment=ES_JAVA_OPTS="-Xms512m -Xmx512m"
autorestart=true
stdout_logfile=/var/log/mall-ease/elasticsearch.log
stderr_logfile=/var/log/mall-ease/elasticsearch.err.log

[program:user]
command=/bin/bash -lc 'until nc -z 127.0.0.1 3306 && nc -z 127.0.0.1 6379 && nc -z 127.0.0.1 8848; do sleep 2; done; java $JAVA_OPTS -jar /app/services/user.jar'
autorestart=true
stdout_logfile=/var/log/mall-ease/user.log
stderr_logfile=/var/log/mall-ease/user.err.log

[program:product]
command=/bin/bash -lc 'until nc -z 127.0.0.1 3306 && nc -z 127.0.0.1 6379 && nc -z 127.0.0.1 8848 && nc -z 127.0.0.1 9200; do sleep 2; done; java $JAVA_OPTS -jar /app/services/product.jar'
autorestart=true
stdout_logfile=/var/log/mall-ease/product.log
stderr_logfile=/var/log/mall-ease/product.err.log

[program:trade]
command=/bin/bash -lc 'until nc -z 127.0.0.1 3306 && nc -z 127.0.0.1 6379 && nc -z 127.0.0.1 8848; do sleep 2; done; java $JAVA_OPTS -jar /app/services/trade.jar'
autorestart=true
stdout_logfile=/var/log/mall-ease/trade.log
stderr_logfile=/var/log/mall-ease/trade.err.log

[program:content]
command=/bin/bash -lc 'until nc -z 127.0.0.1 3306 && nc -z 127.0.0.1 8848; do sleep 2; done; java $JAVA_OPTS -jar /app/services/content.jar'
autorestart=true
stdout_logfile=/var/log/mall-ease/content.log
stderr_logfile=/var/log/mall-ease/content.err.log

[program:marketing]
command=/bin/bash -lc 'until nc -z 127.0.0.1 3306 && nc -z 127.0.0.1 6379 && nc -z 127.0.0.1 8848 && nc -z 127.0.0.1 9200; do sleep 2; done; java $JAVA_OPTS -jar /app/services/marketing.jar'
autorestart=true
stdout_logfile=/var/log/mall-ease/marketing.log
stderr_logfile=/var/log/mall-ease/marketing.err.log

[program:search]
command=/bin/bash -lc 'until nc -z 127.0.0.1 8848 && nc -z 127.0.0.1 9200; do sleep 2; done; java $JAVA_OPTS -jar /app/services/search.jar'
autorestart=true
stdout_logfile=/var/log/mall-ease/search.log
stderr_logfile=/var/log/mall-ease/search.err.log

[program:bff]
command=/bin/bash -lc 'until nc -z 127.0.0.1 6379 && nc -z 127.0.0.1 8848; do sleep 2; done; java $JAVA_OPTS -jar /app/services/bff.jar'
autorestart=true
stdout_logfile=/var/log/mall-ease/bff.log
stderr_logfile=/var/log/mall-ease/bff.err.log

[program:gateway]
command=/bin/bash -lc 'until nc -z 127.0.0.1 6379 && nc -z 127.0.0.1 8848; do sleep 2; done; java $JAVA_OPTS -Dserver.port=${GATEWAY_PORT:-7860} -jar /app/services/gateway.jar'
autorestart=true
stdout_logfile=/var/log/mall-ease/gateway.log
stderr_logfile=/var/log/mall-ease/gateway.err.log
