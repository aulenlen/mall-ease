spring:
  datasource:
    # 环境变量示例:
    # DB_URL=jdbc:mysql://gateway01.eu-central-1.prod.aws.tidbcloud.com:4000/mall_ease?sslMode=VERIFY_IDENTITY&enabledTLSProtocols=TLSv1.2,TLSv1.3
    # DB_USERNAME=your_username
    # DB_PASSWORD=your_password
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

    # 连接池优化配置
    druid:
      initial-size: 3
      min-idle: 3
      max-active: 10
      max-wait: 30000
      # TiDB Cloud 需要更频繁的心跳检测
      time-between-eviction-runs-millis: 30000
      min-evictable-idle-time-millis: 180000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: true
      test-on-return: false

  # Redis 配置（生产环境）
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:16379}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DATABASE:0}
      ssl:
        enabled: false
      timeout: 10s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4
          max-wait: 3000ms

# Sa-Token 配置（生产环境使用强密钥）
sa-token:
  jwt-secret-key: ${SA_TOKEN_SECRET}

# 日志配置（生产环境）
logging:
  level:
    com.mallease: INFO
    org.mybatis: WARN
    com.alibaba.druid: WARN