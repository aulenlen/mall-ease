spring:
  # Nacos 配置中心（从 .env 读取环境变量）
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_SERVER_ADDR}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
      discovery:
        server-addr: ${NACOS_SERVER_ADDR}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}

  # Elasticsearch 配置（Spring Boot 3.x 路径）
  elasticsearch:
    uris: http://192.168.50.148:9200
    connection-timeout: 5s
    socket-timeout: 60s

logging:
  level:
    com.mallease: INFO
