server:
  port: 9056

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}

mybatis:
  mapper-locations: classpath:mybatis/mapper/*.xml


minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  bucketName: ${MINIO_BUCKET:mall-ease}
  accessKey: ${MINIO_ACCESS_KEY:}
  secretKey: ${MINIO_SECRET_KEY:}

# PageHelper 分页插件配置
pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true
  params: count=countSql

# Knife4j API文档配置
knife4j:
  enable: true
  setting:
    language: zh_cn

# SpringDoc OpenAPI配置
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
  group-configs:
    - group: 'CMS内容管理'
      paths-to-match: '/cms/**'
